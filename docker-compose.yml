services:
  postgres:
    image: postgres:15
    container_name: ldi_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: munira_crm
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d munira_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ldi_net

  backend:
    build: ./backend
    container_name: ldi_backend
    restart: always
    environment:
      - PG_URI=postgresql://user:password@postgres:5432/munira_crm
      - PORT=3000
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ldi_net

  nginx:
    image: nginx:1.25-alpine
    container_name: ldi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - ldi_net

volumes:
  pg_data:
    name: ldi_pg_data

networks:
  ldi_net:
    name: ldi_network
    driver: bridge
