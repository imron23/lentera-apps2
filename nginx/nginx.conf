server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index home.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy /api/* ke Node.js backend
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy /tracking.js ke backend (GA4 + Meta Pixel + TikTok dinamis)
    location = /tracking.js {
        proxy_pass         http://backend:3000/tracking.js;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # Static files caching
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Root serves home.html (aggregator)
    location = / {
        try_files /home.html =404;
    }

    # All other requests → static
    location / {
        try_files $uri $uri/ =404;
    }

    # Hide dot files
    location ~ /\. { deny all; }
}
